name: Publish Docker image

on:
  push:
    branches: [ Meta ]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  docker:
    name: Docker image (amd64 + arm64)
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe --tags 需要完整历史与标签

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # 本仓库 Dockerfile 不编译源码, 只从 bin/ 拷贝预编译二进制
      # (docker/file-name.sh: linux/amd64 -> mihomo-linux-amd64-v1-<ver>, linux/arm64 -> mihomo-linux-arm64-<ver>, ver 取自 bin/version.txt)
      - name: Build binaries
        run: |
          mkdir -p bin
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo meta)-fix1-$(git rev-parse --short HEAD)"
          echo "$VERSION" > bin/version.txt
          LDFLAGS='-s -w -buildid= -X "github.com/metacubex/mihomo/constant.Version='"$VERSION"'" -X "github.com/metacubex/mihomo/constant.BuildTime='"$(date -u)"'"'
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "bin/mihomo-linux-amd64-v1-$VERSION" .
          gzip "bin/mihomo-linux-amd64-v1-$VERSION"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "bin/mihomo-linux-arm64-$VERSION" .
          gzip "bin/mihomo-linux-arm64-$VERSION"
          ls -la bin/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
